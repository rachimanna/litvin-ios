name: Build Litvin iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Telegram-iOS tag or commit to build against'
        required: false
        default: ''

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 360

    steps:
      - name: Checkout Litvin
        uses: actions/checkout@v4
        with:
          path: litvin

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install Bazelisk
        run: brew install bazelisk

      - name: Clone Telegram-iOS at pinned ref
        run: |
          UPSTREAM_REF="${{ github.event.inputs.upstream_ref }}"
          if [ -z "$UPSTREAM_REF" ]; then
            UPSTREAM_REF="$(cat litvin/UPSTREAM_REF)"
          fi
          echo "Building against Telegram-iOS ref: $UPSTREAM_REF"
          git clone --recursive https://github.com/TelegramMessenger/Telegram-iOS.git tg-ios
          cd tg-ios
          git checkout "$UPSTREAM_REF"
          git submodule update --init --recursive

      - name: Apply Litvin overlay + patches
        run: |
          cd tg-ios
          bash ../litvin/scripts/apply_overlay.sh ../litvin
          bash ../litvin/scripts/apply_patches.sh ../litvin

      - name: Generate icons from SVG
        run: |
          cd litvin
          bash branding/generate_icons.sh

      - name: Build config from template + secrets
        env:
          LITVIN_API_ID: ${{ secrets.LITVIN_API_ID }}
          LITVIN_API_HASH: ${{ secrets.LITVIN_API_HASH }}
          LITVIN_BUNDLE_ID: ${{ vars.LITVIN_BUNDLE_ID }}
          LITVIN_TEAM_ID: ${{ secrets.LITVIN_TEAM_ID }}
        run: |
          mkdir -p build
          python3 litvin/scripts/build_config.py \
            litvin/overlay/litvin-configuration.json \
            build/litvin-configuration.json

      - name: Build unsigned IPA
        working-directory: tg-ios
        run: |
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=../build/litvin-configuration.json \
            --buildNumber=${{ github.run_number }} \
            --configuration=release_arm64

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R tg-ios/bazel-bin/Telegram/Telegram.app Payload/Litvin.app
          zip -r Litvin-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Litvin-unsigned-${{ github.run_number }}
          path: Litvin-unsigned.ipa
          retention-days: 30

      - name: Attach to release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Litvin-unsigned.ipa
