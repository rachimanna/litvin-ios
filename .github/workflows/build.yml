name: Build Litvin iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Telegram-iOS tag or commit to build against'
        required: false
        default: ''

jobs:
  build:
    # Telegram 13.0.0 builds with Xcode 26.6 on macos-latest. For 13.1+ use runs-on: xcode-27.
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Litvin
        uses: actions/checkout@v4
        with:
          path: litvin

      - name: Resolve upstream ref
        id: ref
        run: |
          REF="${{ github.event.inputs.upstream_ref }}"
          if [ -z "$REF" ]; then REF="$(cat litvin/UPSTREAM_REF | tr -d '\n ')"; fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Upstream: $REF"

      - name: Clone Telegram-iOS at pinned ref
        run: |
          set -x
          mkdir -p /Users/Shared
          # Clone without submodules, switch to the pinned ref, and only then fetch
          # the submodules of that ref: master's submodule pointers can reference
          # commits that are not fetchable (e.g. tgcalls), which breaks --recursive.
          git clone https://github.com/TelegramMessenger/Telegram-iOS.git /Users/Shared/telegram-ios
          cd /Users/Shared/telegram-ios
          git checkout "${{ steps.ref.outputs.ref }}"
          for attempt in 1 2 3; do
            git submodule update --init --recursive -j8 && break
            echo "submodule update failed (attempt $attempt), retrying..."
            sleep 15
          done
          git submodule status --recursive | grep -E '^[-+U]' && { echo "submodules are not checked out"; exit 1; } || true

      - name: Select Xcode from versions.json
        id: xcode
        run: |
          cd /Users/Shared/telegram-ios
          XCODE_VERSION=$(python3 -c 'import json,sys;print(json.load(open("versions.json"))["xcode"])')
          echo "Telegram wants Xcode ${XCODE_VERSION}. Installed:"
          ls -d /Applications/Xcode*.app || true
          XCODE_APP=""
          for candidate in "/Applications/Xcode_${XCODE_VERSION}.app" /Applications/Xcode_${XCODE_VERSION}.*.app; do
            if [ -d "$candidate" ]; then XCODE_APP="$candidate"; break; fi
          done
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
            echo "override=" >> "$GITHUB_OUTPUT"
          else
            echo "Xcode ${XCODE_VERSION} not installed; building with the active Xcode."
            echo "override=--overrideXcodeVersion" >> "$GITHUB_OUTPUT"
          fi
          xcodebuild -version

      - name: Install librsvg
        run: brew install librsvg || true

      - name: Apply Litvin overlay + patches
        run: |
          cd /Users/Shared/telegram-ios
          bash "$GITHUB_WORKSPACE/litvin/scripts/apply_overlay.sh" "$GITHUB_WORKSPACE/litvin"
          bash "$GITHUB_WORKSPACE/litvin/scripts/apply_patches.sh" "$GITHUB_WORKSPACE/litvin"

      - name: Build config from template + secrets
        env:
          LITVIN_API_ID: ${{ secrets.LITVIN_API_ID }}
          LITVIN_API_HASH: ${{ secrets.LITVIN_API_HASH }}
        run: |
          python3 "$GITHUB_WORKSPACE/litvin/scripts/build_config.py" \
            "$GITHUB_WORKSPACE/litvin/overlay/litvin-configuration.json" \
            /Users/Shared/telegram-ios/build-system/litvin-configuration.json

      - name: Prepare test signing profiles
        working-directory: /Users/Shared/telegram-ios
        run: |
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 "$GITHUB_WORKSPACE/litvin/scripts/refresh_fake_profiles.py" "$PWD"

      - name: Restore Bazel cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: /Users/Shared/litvin-bazel-cache
          key: litvin-bazel-${{ steps.ref.outputs.ref }}-${{ github.run_id }}
          restore-keys: |
            litvin-bazel-${{ steps.ref.outputs.ref }}-

      - name: Build sideloadable IPA
        working-directory: /Users/Shared/telegram-ios
        env:
          BAZEL_USER_ROOT: /private/var/tmp/_bazel_litvin
        run: |
          BUILD_NUMBER="${{ github.run_number }}"
          BUILD_OFFSET=$(cat build_number_offset 2>/dev/null || echo 0)
          BUILD_NUMBER=$(( BUILD_NUMBER + BUILD_OFFSET ))
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            ${{ steps.xcode.outputs.override }} \
            --cacheDir=/Users/Shared/litvin-bazel-cache \
            build \
            --configurationPath=build-system/litvin-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

      - name: Save Bazel cache
        # Saved even when the build fails, so the next run only recompiles what changed.
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: /Users/Shared/litvin-bazel-cache
          key: litvin-bazel-${{ steps.ref.outputs.ref }}-${{ github.run_id }}

      - name: Collect IPA + dSYM
        working-directory: /Users/Shared/telegram-ios
        run: |
          OUT="$GITHUB_WORKSPACE/build-output"
          rm -rf "$OUT"
          mkdir -p "$OUT/DSYMs"
          # bazel-bin follows the active target configuration, unlike a hardcoded
          # bazel-out directory name (which changes across Bazel versions).
          cp bazel-bin/Telegram/Telegram.ipa "$OUT/Litvin.ipa"
          shopt -s nullglob
          for f in bazel-bin/Telegram/*.dSYM; do
            cp -R "$f" "$OUT/DSYMs/" || true
          done
          (cd "$OUT" && zip -r Litvin.DSYMs.zip DSYMs 1>/dev/null || true)
          ls -la "$OUT"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Litvin-${{ github.run_number }}
          path: |
            build-output/Litvin.ipa
            build-output/Litvin.DSYMs.zip
          if-no-files-found: warn
          retention-days: 30
