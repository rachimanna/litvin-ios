name: Publish IPA for ESign

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful main Build Litvin iOS run ID (empty = latest successful main build)'
        required: false
        default: ''

permissions:
  actions: read
  contents: write

concurrency:
  group: litvin-publish-esign
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      INPUT_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Select verified main build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$INPUT_RUN_ID"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --workflow build.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo 'No successful main build found. Wait for Build Litvin iOS to finish.'; exit 1; }
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > run.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('run.json'))
          assert run['head_branch'] == 'main' and run['conclusion'] == 'success'
          assert run['path'] == '.github/workflows/build.yml'
          assert run['event'] in ('push', 'workflow_dispatch')
          assert run['repository']['full_name'] == os.environ['GH_REPO']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"id={run['id']}\nnumber={run['run_number']}\nsha={run['head_sha']}\n")
          PY
      - name: Download tested IPA
        env:
          RUN_ID: ${{ steps.build.outputs.id }}
          RUN_NUMBER: ${{ steps.build.outputs.number }}
        run: |
          gh run download "$RUN_ID" --name "Litvin-$RUN_NUMBER" --dir package
          test -s package/Litvin.ipa
      - name: Generate source and checksum
        env:
          RUN_NUMBER: ${{ steps.build.outputs.number }}
        run: |
          python3 scripts/make_esign_source.py package/Litvin.ipa --repository "$GH_REPO" --tag "ios-build-$RUN_NUMBER" --output package/esign-source.json
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 512 -h 512 branding/icon.svg -o package/Litvin-icon.png
      - name: Publish release for ESign import
        env:
          RUN_NUMBER: ${{ steps.build.outputs.number }}
          BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: |
          cat > release-notes.md <<'EOF'
          Download Litvin.ipa, import it into ESign, sign it with your own certificate and provisioning profile, then install.

          This IPA uses a self-signed test identity and must be re-signed for your device. The release includes a SHA-256 checksum and an ESign/AltStore-style source file. No signing keys or login credentials are published.
          EOF
          TAG="ios-build-$RUN_NUMBER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" package/Litvin.ipa package/Litvin.ipa.sha256 package/esign-source.json package/Litvin-icon.png --clobber
          else
            gh release create "$TAG" package/Litvin.ipa package/Litvin.ipa.sha256 package/esign-source.json package/Litvin-icon.png --target "$BUILD_SHA" --title "Litvin iOS build $RUN_NUMBER" --notes-file release-notes.md --latest
          fi
