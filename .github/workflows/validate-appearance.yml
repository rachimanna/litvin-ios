name: Validate local appearance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: appearance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify current upstream appearance patches
        env:
          LITVIN_APPEARANCE_FIXTURE: ${{ runner.temp }}/appearance-fixture
        run: python3 scripts/verify_appearance.py
      - name: Typecheck and test local storage
        run: |
          SOURCE=overlay/submodules/TelegramCore/Sources/Litvin/LitvinAppearance.swift
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun swiftc -typecheck -sdk "$SDK" -target arm64-apple-ios15.0 "$SOURCE"
          xcrun swiftc "$SOURCE" scripts/tests/AppearanceTests.swift -o "$RUNNER_TEMP/appearance-tests"
          "$RUNNER_TEMP/appearance-tests"
      - name: Parse client additions and integrated views
        run: |
          find features overlay "$RUNNER_TEMP/appearance-fixture" -name '*.swift' -print0 | xargs -0 xcrun swiftc -frontend -parse
