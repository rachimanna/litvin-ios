name: Validate Litvin patches
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify runtime and voice patches
        run: python3 scripts/verify_runtime.py
      - name: Parse Litvin Swift sources
        run: |
          find features overlay -name '*.swift' -print0 | xargs -0 xcrun swiftc -frontend -parse
